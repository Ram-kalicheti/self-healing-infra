apiVersion: apps/v1
kind: Deployment
metadata:
  name: healer-app
  labels:
    app: healer-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: healer-app
  template:
    metadata:
      labels:
        app: healer-app
    spec:
      containers:
        - name: healer-app
          image: nginx:1.25
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"