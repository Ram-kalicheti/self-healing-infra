  </style>
</defs>

<rect width="1400" height="760" fill="#f8f9fa"/>

<!-- TITLE -->
<text x="700" y="38" text-anchor="middle" class="t-main">Self-Healing Infrastructure — Multi-Cloud Architecture</text>

<!-- ══ AWS CLOUD ══ -->
<rect x="12" y="60" width="546" height="558" rx="10" fill="#FFFCF5" stroke="#FF9900" stroke-width="2"/>
<rect x="12" y="60" width="546" height="34" rx="10" fill="#232F3E"/>
<rect x="12" y="82"  width="546" height="12" fill="#232F3E"/>
<text x="285" y="82" text-anchor="middle" class="t-head">Amazon Web Services</text>

<!-- VPC group -->
<rect x="28" y="102" width="514" height="480" rx="6" fill="#FAF7FF" stroke="#8C4FFF" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="44" y="119" class="t-sec" fill="#6B20B5">VPC</text>
<text x="44" y="132" class="t-xs" fill="#8C4FFF" font-style="italic">Custom VPC · Public subnets · Route Tables · Internet Gateway · Security Groups</text>

<!-- EKS -->
<rect x="44" y="141" width="228" height="60" rx="6" fill="#FFF5E6" stroke="#FF9900" stroke-width="1.5"/>
<text x="158" y="160" text-anchor="middle" class="t-title" fill="#7D3F00">Amazon EKS</text>
<text x="158" y="175" text-anchor="middle" class="t-sub"   fill="#8D5B00">cluster: healer  ·  us-east-1</text>
<text x="158" y="190" text-anchor="middle" class="t-xs"    fill="#AA7A00">Managed control plane</text>

<!-- EC2 Node -->
<rect x="284" y="141" width="228" height="60" rx="6" fill="#FFF5E6" stroke="#FF9900" stroke-width="1.5"/>
<text x="398" y="160" text-anchor="middle" class="t-title" fill="#7D3F00">EC2 Node Group</text>
<text x="398" y="175" text-anchor="middle" class="t-sub"   fill="#8D5B00">t3.small  ·  2 vCPU  ·  2 GB RAM</text>
<text x="398" y="190" text-anchor="middle" class="t-xs"    fill="#AA7A00">Min size for EKS system pods</text>

<!-- K8s Pods EKS -->
<rect x="44" y="218" width="468" height="52" rx="6" fill="#EBF0FF" stroke="#326CE5" stroke-width="1.5"/>
<text x="278" y="237" text-anchor="middle" class="t-title" fill="#1A3A8F">Kubernetes Workload</text>
<text x="278" y="252" text-anchor="middle" class="t-sub"   fill="#2A4BAF">Deployment · 3 replicas · HPA (3–6 replicas, 60% CPU) · ClusterIP Service</text>
<text x="278" y="262" text-anchor="middle" class="t-xs"    fill="#3A5BCF">Liveness + Readiness probes configured</text>

<!-- Prometheus EKS -->
<rect x="44" y="287" width="228" height="58" rx="6" fill="#FFF2E8" stroke="#E55C00" stroke-width="1.5"/>
<text x="158" y="306" text-anchor="middle" class="t-title" fill="#7A2800">Prometheus</text>
<text x="158" y="321" text-anchor="middle" class="t-sub"   fill="#8A3800">Helm install · namespace: monitoring</text>
<text x="158" y="336" text-anchor="middle" class="t-xs"    fill="#9A4800">port 80 · scrape interval: 15s</text>

<!-- Grafana EKS -->
<rect x="284" y="287" width="228" height="58" rx="6" fill="#FFF5EE" stroke="#F46800" stroke-width="1.5"/>
<text x="398" y="306" text-anchor="middle" class="t-title" fill="#7A3300">Grafana</text>
<text x="398" y="321" text-anchor="middle" class="t-sub"   fill="#8A4300">MTTR Dashboard · port 3000</text>
<text x="398" y="336" text-anchor="middle" class="t-xs"    fill="#9A5300">EKS vs AKS panels · 15s refresh</text>

<!-- IAM -->
<rect x="44" y="362" width="228" height="52" rx="6" fill="#FFEBEE" stroke="#DD344C" stroke-width="1.5"/>
<text x="158" y="381" text-anchor="middle" class="t-title" fill="#7D1A2A">IAM Roles</text>
<text x="158" y="396" text-anchor="middle" class="t-sub"   fill="#8D2A3A">EKS cluster role · Node group role</text>
<text x="158" y="408" text-anchor="middle" class="t-xs"    fill="#9D3A4A">AmazonEKSClusterPolicy</text>

<!-- Terraform AWS -->
<rect x="284" y="362" width="228" height="52" rx="6" fill="#F4EEFF" stroke="#7B42BC" stroke-width="1.5"/>
<text x="398" y="381" text-anchor="middle" class="t-title" fill="#4A1F80">Terraform</text>
<text x="398" y="396" text-anchor="middle" class="t-sub"   fill="#5A2F90">Provisions VPC · EKS · IAM · Node group</text>
<text x="398" y="408" text-anchor="middle" class="t-xs"    fill="#6A3FA0">terraform apply runs locally only</text>

<!-- GitHub Actions CI note inside AWS -->
<rect x="44" y="431" width="468" height="32" rx="4" fill="#F0F0F0" stroke="#ccc" stroke-width="1"/>
<text x="278" y="451" text-anchor="middle" class="t-xs" fill="#555">GitHub Actions runs lint + pytest on PR only  ·  terraform apply never runs in CI</text>

<!-- ══ MIDDLE COLUMN ══ -->

<!-- GitHub Actions -->
<rect x="611" y="96" width="178" height="72" rx="8" fill="#F0F6FF" stroke="#24292E" stroke-width="2"/>
<text x="700" y="116" text-anchor="middle" class="t-title" fill="#24292E">GitHub Actions</text>
<text x="700" y="131" text-anchor="middle" class="t-sub"   fill="#444">CI / CD Pipeline</text>
<text x="700" y="146" text-anchor="middle" class="t-xs"    fill="#666">lint + pytest on pull request</text>
<text x="700" y="158" text-anchor="middle" class="t-xs"    fill="#666">same manifests → EKS + AKS</text>

<!-- Chaos Engine -->
<rect x="611" y="300" width="178" height="88" rx="8" fill="#FFF0EE" stroke="#D13212" stroke-width="2"/>
<text x="700" y="320" text-anchor="middle" class="t-title" fill="#8B1A00">Chaos Engine</text>
<text x="700" y="335" text-anchor="middle" class="t-sub"   fill="#9B2A10">chaos_engine.py  ·  Python 3.13</text>
<text x="700" y="350" text-anchor="middle" class="t-xs"    fill="#AB3A20">kubectl delete pod (scheduled)</text>
<text x="700" y="363" text-anchor="middle" class="t-xs"    fill="#AB3A20">targets both clusters</text>
<text x="700" y="376" text-anchor="middle" class="t-xs"    fill="#AB3A20">python3 chaos/chaos_engine.py</text>

<!-- Recovery box -->
<rect x="620" y="468" width="160" height="68" rx="8" fill="#F0FFF4" stroke="#5CB85C" stroke-width="2"/>
<text x="700" y="487" text-anchor="middle" class="t-title" fill="#1E6B2A">Kubernetes Auto-Heal</text>
<text x="700" y="502" text-anchor="middle" class="t-sub"   fill="#2E7B3A">ReplicaSet restarts deleted pods</text>
<text x="700" y="517" text-anchor="middle" class="t-xs"    fill="#3E8B4A">EKS: ~1.7s  ·  AKS: ~0.2s</text>
<text x="700" y="529" text-anchor="middle" class="t-xs" font-weight="700" fill="#1E6B2A">&lt; 15 seconds total recovery</text>

