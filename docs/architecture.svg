<text x="988" y="321" text-anchor="middle" class="t-sub"   fill="#8A3800">Helm install · namespace: monitoring</text>
<text x="988" y="336" text-anchor="middle" class="t-xs"    fill="#9A4800">port 80 · scrape interval: 15s</text>

