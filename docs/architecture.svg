<rect x="1114" y="287" width="228" height="58" rx="6" fill="#F4EEFF" stroke="#7B42BC" stroke-width="1.5"/>
<text x="1228" y="306" text-anchor="middle" class="t-title" fill="#4A1F80">Terraform</text>
