<text x="1228" y="190" text-anchor="middle" class="t-xs"    fill="#0058AB">East US 2</text>

<!-- K8s Pods AKS -->
<rect x="874" y="218" width="468" height="52" rx="6" fill="#EBF0FF" stroke="#326CE5" stroke-width="1.5"/>
<text x="1108" y="237" text-anchor="middle" class="t-title" fill="#1A3A8F">Kubernetes Workload</text>
<text x="1108" y="252" text-anchor="middle" class="t-sub"   fill="#2A4BAF">Deployment · 3 replicas · HPA (3–6 replicas, 60% CPU) · ClusterIP Service</text>
<text x="1108" y="262" text-anchor="middle" class="t-xs"    fill="#3A5BCF">Liveness + Readiness probes configured</text>

